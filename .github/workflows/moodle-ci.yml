name: Moodle Plugin CI

# Runs the shared Moodle plugin CI: see https://github.com/verzog/moodle-ci-workflows.
# The matrix is the shared default (Moodle 5.1 to 5.3 LTS on PostgreSQL 17 and MariaDB 11, plus Moodle main, which is
# allowed to fail) with one MySQL 8.4 cell added, so all three supported databases stay covered.
# MOODLE_500_STABLE is deliberately excluded: it is below the 5.1 baseline in version.php.
# The shared workflow's Grunt step rebuilds amd/build on MOODLE_501_STABLE and fails if it differs from the commit.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: verzog/moodle-ci-workflows/.github/workflows/moodle-plugin-ci.yml@v1
    with:
      matrix: >-
        [
          {"moodle-branch": "MOODLE_501_STABLE", "php": "8.2", "database": "pgsql"},
          {"moodle-branch": "MOODLE_501_STABLE", "php": "8.4", "database": "mariadb"},
          {"moodle-branch": "MOODLE_502_STABLE", "php": "8.3", "database": "pgsql"},
          {"moodle-branch": "MOODLE_503_STABLE", "php": "8.3", "database": "pgsql"},
          {"moodle-branch": "MOODLE_503_STABLE", "php": "8.4", "database": "mariadb"},
          {"moodle-branch": "MOODLE_503_STABLE", "php": "8.4", "database": "mysqli"},
          {"moodle-branch": "main", "php": "8.4", "database": "pgsql"}
        ]
